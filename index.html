একটি নতুন রিপোজিটরি তৈরি করুন, নাম যা চান দিন (যেমন chat-app), দৃশ্যমানতা Public নির্বাচন করুন (ফ্রি অ্যাকাউন্টের জন্য পাবলিক রিপোজিটরি প্রয়োজন)।

GitHub Pages ডিফল্টভাবে index.html ফাইলটি হোমপেজ হিসেবে লোড করে। আপনার chat.html ফাইলের নাম পরিবর্তন করে index.html করুন, তারপর আপলোড করুন।

ধাপ ৩: GitHub Pages চালু করুন

বাম দিকের মেনুতে Pages (পেজ) এ ক্লিক করুন।

Build and deployment এর অধীনে, Source এর ড্রপডাউন মেনুতে Deploy from a branch নির্বাচন করুন।

<script type="module">

  // তোমার Firebase কনফিগ এখানে বসানো হয়েছে
  const firebaseConfig = {

    databaseURL: "https://chat-fd-1b889-default-rtdb.asia-southeast1.firebasedatabase.app",

    messagingSenderId: "178214329267",
    appId: "1:178214329267:web:33d8ac4a8891d9f42249c6"
  };

  // Firebase চালু করো
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const chatRef = ref(db, 'chat/messages');

  let myName = "";

  // লগইন ফাংশন
  window.login = function() {
    const name = document.getElementById('usernameInput').value.trim();
    if (!name) return alert("নাম লেখো ভাই!");
    myName = name;
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('chatBox').classList.add('active');
    listenForMessages();
  };

  // মেসেজ পাঠানো
  window.sendMessage = function() {
    const input = document.getElementById('msgInput');
    const text = input.value.trim();
    if (!text) return;

    push(chatRef, {
      name: myName,
      text: text,
      timestamp: serverTimestamp()
    });

    input.value = '';
  };

  // রিয়েল-টাইমে মেসেজ শোনা
  function listenForMessages() {
    const messagesDiv = document.getElementById('messages');

    onChildAdded(chatRef, (snapshot) => {
      const data = snapshot.val();
      if (!data) return;

      const msgEl = document.createElement('div');
      msgEl.className = 'msg ' + (data.name === myName ? 'mine' : 'theirs');

      const nameEl = document.createElement('div');
      nameEl.className = 'name';
      nameEl.textContent = data.name;

      const textEl = document.createElement('div');
      textEl.textContent = data.text;

      msgEl.appendChild(nameEl);
      msgEl.appendChild(textEl);
      messagesDiv.appendChild(msgEl);

      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    });
  }

  // এন্টার চাপলে মেসেজ পাঠাও
  document.getElementById('msgInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') sendMessage();
  });
